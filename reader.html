<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading - The Cozy Nook</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.3.0/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.3.0/700.css">
    <link rel="stylesheet" href="assets/css/reader.css?v=2.5">
</head>
<body class="theme-sepia" id="readerBody">
    
    <!-- Reader Top Navigation -->
    <header class="reader-header" id="readerHeader">
        <div class="nav-left">
            <a href="index.html" class="hand-nav-btn flex items-center gap-1.5" title="Return to Wooden Shelves">
                <img src="assets/images/ui/arrow_wood_left.png" alt="" class="w-3.5 h-2 pixel-art-img">
                <span>Shelf</span>
            </a>
            <button class="hand-nav-btn hidden lg:inline-flex items-center gap-1.5" id="btnToggleDrawer" title="Reading Menu & Contents">
                <img src="assets/images/ui/cat_paw.png" alt="" class="w-4 h-4 pixel-art-img">
                <span>Menu</span>
                <span id="headerBookmarkBadge" class="hidden text-xs bg-[#e07a5f] text-white px-1.5 py-0.2 rounded-full font-bold">0</span>
            </button>
            <div class="book-meta hidden lg:block">
                <h1 class="book-title" id="bookTitle">Loading Book...</h1>
                <span class="book-author" id="bookAuthor">...</span>
            </div>
        </div>

        <!-- Center: Chapter Title on Mobile/Tablet or Desktop Mode Switcher -->
        <div class="nav-center">
            <div class="mobile-center-title lg:hidden" id="mobileCenterTitle">
                ...
            </div>
            <div class="mode-switcher-wrap hidden lg:flex">
                <button class="mode-btn active" id="btnModeSingle" data-mode="single" title="One Page at a time">
                    Single
                </button>
                <button class="mode-btn" id="btnModeSpread" data-mode="spread" title="Two Pages side-by-side">
                    Two Pages
                </button>
                <button class="mode-btn" id="btnModeScroll" data-mode="scroll" title="Endless Continuous Scrolling">
                    Scroll
                </button>
            </div>
        </div>

        <div class="nav-right">
            <!-- Fullscreen Button (Desktop) -->
            <button class="hand-nav-btn hidden lg:inline-flex items-center gap-1.5" id="btnFullscreen" title="Toggle Full Screen (F)">
                <span id="fullscreenIcon"><img src="assets/images/icons/settings.png" alt="" class="w-3.5 h-3.5 pixel-art-img"></span>
                <span id="fullscreenText">Full Screen</span>
            </button>

            <!-- Bookmark Button -->
            <button class="hand-nav-btn flex items-center gap-1.5" id="btnAddBookmark" title="Bookmark current page">
                <span id="bookmarkIcon"><img src="assets/images/icons/star.png" alt="" class="w-3.5 h-3.5 pixel-art-img"></span>
                <span id="bookmarkText">Bookmark</span>
            </button>

            <!-- Appearance Settings Menu -->
            <div class="dropdown-wrapper">
                <button class="hand-nav-btn" id="btnAppearance" title="Appearance Settings">
                    Aa Font
                </button>
                <div class="appearance-menu" id="appearanceMenu">
                    <div class="menu-section">
                        <label>READING THEME</label>
                        <div class="theme-picker">
                            <button class="theme-choice btn-theme-light" data-theme="theme-light">Light</button>
                            <button class="theme-choice btn-theme-sepia active" data-theme="theme-sepia">Paper</button>
                            <button class="theme-choice btn-theme-dark" data-theme="theme-dark">Dusk</button>
                            <button class="theme-choice btn-theme-black" data-theme="theme-black">Night</button>
                        </div>
                    </div>

                    <div class="menu-section">
                        <label>TEXT SIZE</label>
                        <div class="font-size-controls">
                            <button class="btn-size" id="btnFontDec">-</button>
                            <span id="fontSizeDisplay">105%</span>
                            <button class="btn-size" id="btnFontInc">+</button>
                        </div>
                    </div>

                    <div class="menu-section">
                        <label>TYPOGRAPHY</label>
                        <div class="font-family-controls">
                            <button class="font-btn active" data-font="'Lora', Georgia, serif" style="font-family: 'Lora', Georgia, serif;">Lora</button>
                            <button class="font-btn" data-font="'Merriweather', serif" style="font-family: 'Merriweather', serif;">Classic</button>
                            <button class="font-btn" data-font="'Patrick Hand', cursive" style="font-family: 'Patrick Hand', cursive;">Handwritten</button>
                            <button class="font-btn" data-font="'OpenDyslexic', sans-serif" style="font-family: 'OpenDyslexic', sans-serif;">Dyslexic</button>
                        </div>
                    </div>

                    <div class="menu-section pt-1 border-t border-[var(--border-chrome)]">
                        <label>VIEW CONTROLS</label>
                        <div class="flex flex-col gap-1.5">
                            <button type="button" class="hand-nav-btn w-full justify-center text-center flex items-center gap-2" id="btnMenuFullscreen">
                                <img src="assets/images/icons/settings.png" alt="" class="w-3.5 h-3.5 pixel-art-img">
                                <span>Toggle Full Screen (F)</span>
                            </button>
                            <button type="button" class="hand-nav-btn w-full justify-center text-center flex items-center gap-2" id="btnMenuZen">
                                <img src="assets/images/icons/moon.png" alt="" class="w-3.5 h-3.5 pixel-art-img">
                                <span>Distraction-Free (Z)</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <button class="hand-nav-btn hidden lg:inline-flex" id="btnDownloadBook" title="Download File">
                Download
            </button>
        </div>
    </header>

    <!-- Reader Main Stage -->
    <div class="reader-stage" id="readerStage">
        <!-- Tactile Pull Tab for Mobile/Tablet Side Panel -->
        <button class="reader-pull-tab lg:hidden flex items-center justify-center" id="btnReaderPullTab" title="Open Reading Panel">
            <span id="readerPullTabIcon" class="flex items-center justify-center">
                <img src="assets/images/ui/cat_paw.png" alt="" class="w-4 h-4 pixel-art-img select-none">
            </span>
        </button>

        <!-- Backdrop overlay for slide-out drawer -->
        <div class="reader-drawer-backdrop" id="readerDrawerBackdrop"></div>

        <!-- Floating Zen / Distraction-Free Toggle Pill -->
        <button id="btnFloatingZen" class="floating-zen-btn flex items-center gap-1.5" title="Toggle distraction-free view (Z)">
            <span id="zenIcon"><img src="assets/images/icons/moon.png" alt="" class="w-3.5 h-3.5 pixel-art-img"></span>
            <span id="zenText">Zen View</span>
        </button>

        <!-- Visual Bookmark Ribbon on Page Corner -->
        <div id="pageBookmarkRibbon" class="page-corner-ribbon" title="Click to bookmark this page"></div>
        
        <!-- Slide-out Reader Side Panel (Modes, Quick Actions, Chapters & Bookmarks) -->
        <aside class="toc-sidebar" id="tocSidebar">
            <div class="toc-header">
                <div class="flex items-center gap-2">
                    <img src="assets/images/icons/book_open.png" alt="" class="w-4 h-4 pixel-art-img">
                    <span class="font-bold text-base text-[#2c221e]">Reading Panel</span>
                </div>
                <button class="btn-icon flex items-center justify-center" id="btnCloseDrawer" title="Close Panel">
                    <img src="assets/images/icons/close.png" alt="Close" class="w-3.5 h-3.5 pixel-art-img">
                </button>
            </div>

            <!-- Reading Options & Quick Controls Card -->
            <div class="sidebar-options-section">
                <div class="sidebar-section-title">
                    <span>READING MODE</span>
                    <span class="text-[11px] text-[#8c7b6f] font-normal">Page flow</span>
                </div>
                <div class="sidebar-mode-grid">
                    <button class="sidebar-mode-btn active flex items-center justify-center gap-1.5" data-mode="single" id="btnSidebarSingle">
                        <img src="assets/images/icons/book.png" alt="" class="w-3.5 h-3.5 pixel-art-img">
                        <span>Single Page</span>
                    </button>
                    <button class="sidebar-mode-btn flex items-center justify-center gap-1.5" data-mode="scroll" id="btnSidebarScroll">
                        <img src="assets/images/icons/reload.png" alt="" class="w-3.5 h-3.5 pixel-art-img">
                        <span>Endless Scroll</span>
                    </button>
                    <button class="sidebar-mode-btn col-span-2 hidden sm:flex items-center justify-center gap-1.5" data-mode="spread" id="btnSidebarSpread">
                        <img src="assets/images/icons/book_open.png" alt="" class="w-3.5 h-3.5 pixel-art-img">
                        <span>Two Pages Spread</span>
                    </button>
                </div>

                <div class="sidebar-section-title mt-3">
                    <span>DISPLAY & QUICK ACTIONS</span>
                </div>
                <div class="sidebar-action-grid">
                    <button class="sidebar-action-btn flex items-center justify-center gap-1.5" id="btnSidebarFullscreen">
                        <span id="sidebarFullscreenIcon"><img src="assets/images/icons/settings.png" alt="" class="w-3.5 h-3.5 pixel-art-img"></span>
                        <span id="sidebarFullscreenText">Full Screen</span>
                    </button>
                    <button class="sidebar-action-btn flex items-center justify-center gap-1.5" id="btnSidebarZen">
                        <span><img src="assets/images/icons/moon.png" alt="" class="w-3.5 h-3.5 pixel-art-img"></span>
                        <span>Zen View</span>
                    </button>
                    <button class="sidebar-action-btn col-span-2 flex items-center justify-center gap-2" id="btnSidebarBookmark">
                        <span id="sidebarBookmarkIcon"><img src="assets/images/icons/star.png" alt="" class="w-3.5 h-3.5 pixel-art-img"></span>
                        <span id="sidebarBookmarkText">Bookmark Current Page</span>
                    </button>
                    <button class="sidebar-action-btn col-span-2 flex items-center justify-center gap-2" id="btnSidebarDownload">
                        <img src="assets/images/icons/inventory_bag.png" alt="" class="w-3.5 h-3.5 pixel-art-img">
                        <span>Download EPUB File</span>
                    </button>
                </div>
            </div>
            
            <!-- Navigation Tabs (Chapters vs Bookmarks) -->
            <div class="drawer-tabs-wrapper">
                <div class="drawer-tabs">
                    <button class="drawer-tab active" id="tabChapters">Chapters</button>
                    <button class="drawer-tab" id="tabBookmarks">Bookmarks (<span id="bookmarkCount">0</span>)</button>
                </div>
            </div>
            
            <!-- Tab Content: Chapters -->
            <div class="toc-content" id="tocList"></div>

            <!-- Tab Content: Bookmarks -->
            <div class="toc-content hidden" id="bookmarkList">
                <p class="text-xs text-[#786457] p-3 italic">No bookmarks yet. Click "Bookmark" to save your favorite spots!</p>
            </div>
        </aside>

        <!-- Turn Page Arrows (Shown in Paginated Modes) -->
        <button class="turn-page-btn prev-btn" id="btnPrevPage" title="Previous Page (Left Arrow)">
            ‹
        </button>

        <!-- Viewer Container for epub.js -->
        <div id="epubViewer" class="epub-viewer single-page-mode"></div>

        <button class="turn-page-btn next-btn" id="btnNextPage" title="Next Page (Right Arrow)">
            ›
        </button>

        <!-- Loading Spinner -->
        <div class="reader-loader" id="readerLoader">
            <div class="spinner"></div>
            <p class="text-sm font-bold">Turning pages...</p>
        </div>
    </div>

    <!-- Reading Progress Footer Bar -->
    <footer class="reader-footer" id="readerFooter">
        <div class="reading-progress-track" id="progressTrack">
            <div class="reading-progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
        <div class="footer-info">
            <span id="chapterTitle">The Cozy Nook</span>
            <span id="footerProgress">0% read</span>
        </div>
    </footer>

    <!-- Notification Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="assets/js/mobi_parser.js?v=2.4"></script>
    <script src="assets/js/db.js?v=2.4"></script>
    <script src="assets/js/sound.js?v=2.5"></script>
    <script src="assets/js/reader.js?v=2.5"></script>
</body>
</html>
