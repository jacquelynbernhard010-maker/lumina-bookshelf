<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader - Lumina Bookshelf</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/reader.css">
</head>
<body class="theme-sepia" id="readerBody">
    <!-- Reader Top Navigation -->
    <header class="reader-header" id="readerHeader">
        <div class="nav-left">
            <a href="index.html" class="btn-icon" title="Return to Bookshelf">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <button class="btn-icon" id="btnToggleToc" title="Table of Contents">
                <i class="fa-solid fa-list-ul"></i>
            </button>
            <div class="book-meta">
                <h1 class="book-title" id="bookTitle">Loading Book...</h1>
                <span class="book-author" id="bookAuthor">...</span>
            </div>
        </div>

        <div class="nav-center">
            <span class="progress-indicator" id="progressIndicator">0% read</span>
        </div>

        <div class="nav-right">
            <!-- Appearance Menu Dropdown -->
            <div class="dropdown-wrapper">
                <button class="btn-icon" id="btnAppearance" title="Appearance Settings">
                    <i class="fa-solid fa-font"></i>
                </button>
                <div class="appearance-menu" id="appearanceMenu">
                    <div class="menu-section">
                        <label>THEME</label>
                        <div class="theme-picker">
                            <button class="theme-choice btn-theme-light" data-theme="theme-light">Light</button>
                            <button class="theme-choice btn-theme-sepia active" data-theme="theme-sepia">Sepia</button>
                            <button class="theme-choice btn-theme-dark" data-theme="theme-dark">Dark</button>
                            <button class="theme-choice btn-theme-black" data-theme="theme-black">Black</button>
                        </div>
                    </div>

                    <div class="menu-section">
                        <label>FONT SIZE</label>
                        <div class="font-size-controls">
                            <button class="btn-size" id="btnFontDec"><i class="fa-solid fa-minus"></i></button>
                            <span id="fontSizeDisplay">105%</span>
                            <button class="btn-size" id="btnFontInc"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                    <div class="menu-section">
                        <label>FONT FAMILY</label>
                        <div class="font-family-controls">
                            <button class="font-btn active" data-font="Merriweather, serif">Serif</button>
                            <button class="font-btn" data-font="Inter, sans-serif">Sans</button>
                            <button class="font-btn" data-font="'Cinzel', serif">Cinzel</button>
                        </div>
                    </div>
                </div>
            </div>

            <button class="btn-icon" id="btnDownloadBook" title="Download File">
                <i class="fa-solid fa-download"></i>
            </button>

            <button class="btn-icon" id="btnFullscreen" title="Toggle Fullscreen">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- Reader Main Stage -->
    <div class="reader-stage">
        <!-- Slide-out Table of Contents Sidebar -->
        <aside class="toc-sidebar" id="tocSidebar">
            <div class="toc-header">
                <h3>Table of Contents</h3>
                <button class="btn-icon btn-close-toc" id="btnCloseToc">&times;</button>
            </div>
            <div class="toc-content" id="tocList"></div>
        </aside>

        <!-- Turn Page Click Areas & Floating Arrows -->
        <button class="turn-page-btn prev-btn" id="btnPrevPage" title="Previous Page (Left Arrow)">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <!-- Viewer Container for epub.js -->
        <div id="epubViewer" class="epub-viewer"></div>

        <button class="turn-page-btn next-btn" id="btnNextPage" title="Next Page (Right Arrow)">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- Loading Spinner -->
        <div class="reader-loader" id="readerLoader">
            <div class="spinner"></div>
            <p>Loading digital pages...</p>
        </div>
    </div>

    <!-- Reading Progress Footer Bar -->
    <footer class="reader-footer" id="readerFooter">
        <div class="reading-progress-track" id="progressTrack">
            <div class="reading-progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
        <div class="footer-info">
            <span id="chapterTitle">Reading...</span>
            <span id="footerProgress">0%</span>
        </div>
    </footer>

    <!-- Scripts: Supabase, JSZip, ePub.js, Storage, Reader -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/reader.js"></script>
</body>
</html>
